name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (gate principal)
        run: npx tsc --noEmit

      # El proyecto aún no tiene eslint.config.* (script `npm run lint` falla
      # sin configuración). Se deja como paso informativo hasta migrar a
      # flat config; el gate real lo da el typecheck y el build.
      - name: Lint (informativo)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # Placeholders públicos solo para que el build typecheck/compile;
          # no se despliega desde este job.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:8000

  backend:
    name: Backend (compile check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificación de sintaxis
        run: python -m compileall -q app
